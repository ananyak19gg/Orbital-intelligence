services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: orbital
      POSTGRES_USER: orbital
      POSTGRES_PASSWORD: orbital
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbital"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://orbital:orbital@db:5432/orbital
      USER_AGENT: OrbitalIntelligence/1.0 (academic public-data research)
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
  web:
    image: node:24-alpine
    working_dir: /web
    volumes: ["./frontend:/web"]
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
